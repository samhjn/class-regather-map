{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f4f3fb">
  <title>{{ classroom.name }} · 同窗蹭饭地图</title>
  <link rel="stylesheet" href="{% static 'gathering/style.css' %}">
  <script type="module" src="{% static 'gathering/app.js' %}"></script>
</head>
<body>
  <main id="gate" class="gate" hidden>
    <div class="gate-card">
      <p class="eyebrow">只属于我们班的地图</p>
      <h1 id="class-title">{{ classroom.name }}</h1>
      <p id="class-description">看看大家落脚在哪座城，为下一次相聚留个坐标。</p>
      <form id="unlock-form"><label>班级查看码<input name="password" type="password" required autocomplete="current-password" maxlength="200"></label>
        <button class="primary" type="submit">打开班级地图</button></form>
      <p id="entry-hint" class="muted" role="status"></p>
      <button id="gate-login" class="text-button" type="button">已认领的同学，登录个人账号</button>
    </div>
  </main>

  <div id="app" hidden>
    <div id="map" class="map" aria-label="同学分布地图"></div>
    <p id="map-status" class="map-status" role="status" hidden></p>
    <div class="top">
      <div id="scope-seg" class="seg" role="group" aria-label="境内或境外">
        <button type="button" data-scope="china" class="on" aria-pressed="true">境内<em id="count-china">0</em></button>
        <button type="button" data-scope="world" aria-pressed="false">境外<em id="count-world">0</em></button>
      </div>
      <button id="me-btn" class="mebtn" type="button"><i aria-hidden="true">我</i>更新位置<span class="dot" hidden aria-label="位置很久没确认了"></span></button>
    </div>
    <button id="range-chip" class="fchip" type="button" hidden></button>
    <button id="fit-all" class="fit-all" type="button" hidden>看全部</button>
    <section id="sheet" class="sheet" data-detent="peek" aria-label="同学名单">
      <button class="grab" data-drag type="button" aria-label="展开或收起名单" aria-expanded="false"></button>
      <div id="sheet-body">
        <div id="sheet-head" data-drag>
          <div class="h2"><div><h2 id="sheet-title"></h2><p id="sheet-summary" class="s"></p><p id="unplaced" class="s" role="status" hidden></p></div>
            <button id="region-close" class="x" type="button" aria-label="回到全部同学" hidden><i aria-hidden="true">×</i></button></div>
          <div id="peek-end"></div>
          <div id="range"></div>
          <div id="legend" class="legend" aria-hidden="true">人数 <i style="background:#d4ccff"></i>1 <i style="background:#a898ff"></i>2–3 <i style="background:#7a63ff"></i>4–9 <i style="background:#4b3bea"></i>10+</div>
          <nav id="account" class="account" aria-label="账号"></nav>
        </div>
        <label id="search-box" class="search"><span class="visually-hidden">找同学</span><input id="search" type="search" placeholder="找同学、城市或一句近况" autocomplete="off"></label>
        <div id="list"></div>
      </div>
    </section>
  </div>

  <dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="icon-button" type="button" aria-label="关闭窗口">×</button></div><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>本应用需要 JavaScript 才能显示地图和编辑位置。</noscript>
</body>
</html>
